<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI2 Lecture Lab</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1b1e25;
        --text: #e6e8eb;
        --muted: #9aa0a6;
        --border: #2c313a;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 16px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .subtitle { margin: 0 0 32px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card .num { font-size: .8rem; font-weight: 600; color: var(--accent); }
    .card h2 { margin: 0; font-size: 1.1rem; }
    .card .status {
      margin-top: auto;
      align-self: flex-start;
      font-size: .75rem;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .card.disabled { cursor: not-allowed; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <h1>AI2 Lecture Lab</h1>
    <p class="subtitle">실습 자료 모음</p>

    <section class="grid">
      <!-- 링크 연결 시: href="#" 를 실제 주소로 바꾸고 class="disabled", aria-disabled 제거 -->
      <a class="card disabled" href="#" aria-disabled="true">
        <span class="num">01</span>
        <h2>할일 목록 리스트</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card disabled" href="#" aria-disabled="true">
        <span class="num">02</span>
        <h2>클로드 활용 스네이크 게임</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card disabled" href="#" aria-disabled="true">
        <span class="num">03</span>
        <h2>개인 프로파일</h2>
        <span class="status">준비 중</span>
      </a>
      <a class="card disabled" href="#" aria-disabled="true">
        <span class="num">04</span>
        <h2>주식 일기</h2>
        <span class="status">준비 중</span>
      </a>
    </section>
  </main>
  <script>
    document.querySelectorAll('.card.disabled').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>
</html>
